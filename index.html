<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학년부장 OS</title>
<script>
/* ── 첫 로딩 안내: 시트에서 불러오는 동안 경과 초를 보여 준다. 이 기기에 내 데이터가 있으면 띄우지 않는다. */
window.__LG_CFG = { keys: ["grade-head-os.v1"], msg: '시트에서 불러오는 중…', accent: '#3182F6', bg: '#F5F6F8' };
(function(){
  var cfg = window.__LG_CFG;
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function sheetConnected(){
    try {
      if (/[?&#]s=/.test(location.hash + location.search)) return true;
      for (var i = 0; i < localStorage.length; i++){ var v = lsGet(localStorage.key(i)) || ''; if (v.indexOf('script.google.com/macros/s/') >= 0) return true; }
    } catch(e){}
    return false;
  }
  function hasLocalData(){
    if (!cfg.keys || !cfg.keys.length) return false;
    for (var i = 0; i < cfg.keys.length; i++){ var v = lsGet(cfg.keys[i]); if (v && v !== 'null' && v !== 'undefined' && v.length > 2) return true; }
    return false;
  }
  var el = null, t0 = 0, iv = null, msg = cfg.msg || '시트에서 불러오는 중…', failsafe = null;
  function label(){ var s = Math.max(0, Math.round((Date.now() - t0) / 1000)); return msg + ' (' + s + '초)'; }
  function show(m){
    if (m) msg = m;
    if (el){ var n = document.getElementById('lgTxt'); if (n) n.textContent = label(); return; }
    t0 = Date.now();
    el = document.createElement('div'); el.id = 'loadGate'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite');
    el.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:' + (cfg.bg || '#F2F4F6') + ';color:' + (cfg.color || '#191F28') + ';font:600 15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;';
    var st = document.createElement('style');
    st.textContent = '@keyframes lgspin{to{transform:rotate(360deg)}}@media (prefers-color-scheme:dark){#loadGate{background:#17171C!important;color:#F2F4F6!important}}';
    (document.head || document.documentElement).appendChild(st);
    var sp = document.createElement('div');
    sp.style.cssText = 'width:28px;height:28px;border-radius:50%;border:3px solid rgba(120,130,150,.25);border-top-color:' + (cfg.accent || '#3182F6') + ';animation:lgspin .8s linear infinite';
    var tx = document.createElement('div'); tx.id = 'lgTxt'; tx.textContent = label();
    el.appendChild(sp); el.appendChild(tx);
    (document.body || document.documentElement).appendChild(el);
    if (iv) clearInterval(iv);
    iv = setInterval(function(){ var n = document.getElementById('lgTxt'); if (n) n.textContent = label(); }, 1000);
    if (failsafe) clearTimeout(failsafe);
    failsafe = setTimeout(done, 20000);
  }
  function done(){
    window.__LG_DONE = true;
    if (failsafe){ clearTimeout(failsafe); failsafe = null; }
    if (iv){ clearInterval(iv); iv = null; }
    if (el && el.parentNode) el.parentNode.removeChild(el);
    el = null;
  }
  window.LoadGate = { show: show, done: done, active: function(){ return !!el; }, label: label };
  if (cfg.auto !== false && sheetConnected() && !hasLocalData()){
    if (document.body) show();
    else document.addEventListener('DOMContentLoaded', function(){ if (!el && !window.__LG_DONE) show(); });
  }
})();
</script>
<meta name="description" content="12학급 초등학교 학년부장 운영 시스템 — 판단 브레이크, 1년 레이더, 보고선, 민원·휴직 트래커.">
<meta name="theme-color" content="#F5F6F8">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="학년부장 OS">

<link rel="apple-touch-icon" href="./apple-touch-icon.png">

</head>
<body>
<div id="app">
  <div style="min-height:100vh;display:grid;place-items:center;font-family:inherit">
    <div style="text-align:center">
      <div style="width:56px;height:56px;border-radius:16px;margin:0 auto 14px;background:linear-gradient(150deg,#4E9BFF,#1B64DA);display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800">學</div>
      <div style="font-size:17px;font-weight:800;letter-spacing:-0.03em">학년부장 OS</div>
    </div>
  </div>
</div>
